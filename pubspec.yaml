name: apple_music_clone
description: Serverless Apple Music UI clone with YouTube streaming and synced lyrics.
publish_to: 'none'
version: 1.0.1+2
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.0
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.1
  youtube_explode_dart: ^2.3.6
  http: ^1.2.2
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
