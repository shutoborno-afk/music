name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Arrange files and create Android project
        run: |
          mkdir -p /tmp/lib/models /tmp/lib/services /tmp/lib/providers /tmp/lib/screens
          cp main.dart /tmp/lib/
          cp song_model.dart /tmp/lib/models/
          cp youtube_lyrics_service.dart /tmp/lib/services/
          cp player_provider.dart /tmp/lib/providers/
          cp now_playing_screen.dart /tmp/lib/screens/
          cp pubspec.yaml /tmp/pubspec.yaml
          cp AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --project-name apple_music_clone --org com.applemusic .
          rm -rf lib && cp -r /tmp/lib lib
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apple-music-clone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
